<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Begrepstrener KI</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f4f7fb} .card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)} button{padding:10px 15px;margin-top:10px} input{width:100%;padding:8px} #feedback{font-weight:bold;margin-top:10px}</style></head><body><div class="card"><h1>Begrepstrener: KI-begreper</h1><p id="question"></p><input id="answer" type="text" placeholder="Skriv svaret ditt"><br><button onclick="check()">Sjekk svar</button><button onclick="nextQ()">Neste</button><p id="feedback"></p><p>Poeng: <span id="score">0</span></p></div><script>const qs=[{q:'Hva står KI for?',a:'kunstig intelligens'},{q:'Hva kalles KI som lager nytt innhold?',a:'generativ kunstig intelligens'},{q:'Hva kalles instruksjonen man gir en chatbot?',a:'prompt'}];let i=0,s=0;function show(){document.getElementById('question').textContent=qs[i].q;document.getElementById('answer').value='';document.getElementById('feedback').textContent='';}function check(){let v=document.getElementById('answer').value.trim().toLowerCase();if(v===qs[i].a){s++;document.getElementById('score').textContent=s;document.getElementById('feedback').textContent='Riktig!';}else{document.getElementById('feedback').textContent='Feil. Riktig svar: '+qs[i].a;}}function nextQ(){i=(i+1)%qs.length;show();}show();</script></body></html>
